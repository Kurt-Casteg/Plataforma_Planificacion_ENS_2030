<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <script src="js/tema-inicial.js"></script>
  <meta name="author" content="Kurt Castro Ortega">
  <meta name="description" content="Plataforma institucional de la SEREMI de Salud de Ñuble para planificar, consolidar y analizar las actividades del Plan Nacional de Salud y del Plan de Gestión Institucional.">
  <meta name="robots" content="noindex">

  <!--
    Política de seguridad de contenido.
    Las librerías (Chart.js, SheetJS y Supabase) se sirven desde este mismo
    sitio, en vendor/: ningún script viene de otro dominio. 'unsafe-inline' NO
    está habilitado para scripts: no hay JavaScript escrito dentro del HTML,
    lo que cierra la vía principal de inyección de código.
  -->
  <!--
    IMPORTANTE: cada directiva termina en punto y coma, incluida la última.
    Algunos antivirus (Kaspersky, entre otros) reescriben esta política para
    agregar sus propios dominios; si la última directiva no cierra con «;», lo
    que inyectan se pega a ella y la invalida.

    connect-src incluye wss: además de https: porque la sincronización en tiempo
    real de Supabase usa WebSocket, y el esquema https:// no lo cubre.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    connect-src 'self' https://*.supabase.co wss://*.supabase.co;
    font-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'none';
    ">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>Plataforma de Planificación · SEREMI de Salud de Ñuble</title>

  <link rel="icon" href="assets/logo-nuble.png" type="image/png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">

  <link rel="preload" href="data/catalogos.json" as="fetch" type="application/json" crossorigin>

  <!--

    importa… Con ella los pide todos de una vez. Si un módulo nuevo se importa
    al arrancar, agrégalo aquí; si falta, la plataforma funciona igual, solo
    un poco más lenta. Los que se cargan bajo demanda (exportar, configuración,
    sesión, nube, informe) no van.
  -->
  <link rel="modulepreload" href="js/app.js">
