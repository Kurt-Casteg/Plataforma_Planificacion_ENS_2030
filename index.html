<!DOCTYPE html>
<html lang="es-CL" data-tema="claro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Plataforma institucional de la SEREMI de Salud de Ñuble para planificar, consolidar y analizar las actividades del Plan Nacional de Salud y del Plan de Gestión Institucional.">
  <meta name="robots" content="noindex">

  <!--
    Política de seguridad de contenido.
    Las librerías (Chart.js y SheetJS) se sirven desde este mismo sitio, en
    vendor/. Las CDN solo quedan permitidas como respaldo. 'unsafe-inline' NO
    está habilitado para scripts: no hay JavaScript escrito dentro del HTML,
    lo que cierra la vía principal de inyección de código.
  -->
  <!--
    IMPORTANTE: cada directiva termina en punto y coma, incluida la última.
    Algunos antivirus (Kaspersky, entre otros) reescriben esta política para
    agregar sus propios dominios; si la última directiva no cierra con «;», lo
    que inyectan se pega a ella y la invalida.

    connect-src incluye wss: además de https: porque la sincronización en tiempo
    real de Supabase usa WebSocket, y el esquema https:// no lo cubre.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://esm.sh;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    connect-src 'self' https://*.supabase.co wss://*.supabase.co https://esm.sh;
    font-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'none';
    ">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>Plataforma de Planificación · SEREMI de Salud de Ñuble</title>

  <link rel="icon" href="assets/logo-nuble.png" type="image/png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">

  <link rel="preload" href="data/catalogos.json" as="fetch" type="application/json" crossorigin>
</head>
<body>
  <a class="saltar-al-contenido" href="#contenidoPrincipal">Saltar al contenido</a>

  <div id="aplicacion">
    <!-- La interfaz se construye desde js/app.js -->
    <div class="envoltura contenido">
      <p class="texto-cuerpo">Cargando la plataforma…</p>
    </div>
  </div>

  <noscript>
    <div class="envoltura contenido">
      <h1>Se requiere JavaScript</h1>
      <p>Esta plataforma necesita JavaScript habilitado para funcionar. Actívalo en la configuración de tu navegador y vuelve a cargar la página.</p>
    </div>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
